# Phase A — Text-Anchor Warm-up (method.tex Sec. 3.6, two-phase optimization).
# Only L_anc is active; only the Q-Former, the K visual queries q_k, the
# projection W_v, and the BiomedBERT LoRA residual phi are updated.
# Encoder, AnomalyHead, and Stage III decoder are frozen / not built.
phase: a

trainable:
  encoder_lora: false
  encoder_full: false
  anomaly_head: false
  qformer: true
  text_anchor_lora: true
  decoder_lora: false

loss_flags:
  use_att: false
  use_anc: true
  use_gen: false

w_att: 0.0
w_anc: 1.0
w_gen: 0.0

optim:
  lr: 2.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_ratio: 0.05

bsz_per_gpu: 2
grad_accum: 4
total_steps: 2000
log_every: 50
val_every: 500
save_every: 1000
